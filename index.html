<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <title>WMG Service - Panel Szefa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Menu boczne -->
        <div class="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col justify-between">
            <div>
                <h1 class="text-xl font-bold text-sky-400 mb-6">🛠️ WMG Service</h1>
                <nav class="space-y-1">
                    <a href="#" class="block px-4 py-2.5 rounded-lg font-medium bg-sky-600 text-white">Panel Główny</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-white">Pracownicy</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-white">Kalkulator i Kosztorysy</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-white">Galeria Zleceń</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-white">Komunikator</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-white">Kalendarz</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg font-medium text-slate-400 hover:bg-slate-800 hover:text-white">Ustawienia</a>
                </nav>
            </div>
            <div class="text-xs text-slate-500 pt-4 border-t border-slate-800">WMG Service v2.6 - Online</div>
        </div>

        <!-- Główna treść -->
        <div class="flex-1 p-8 overflow-y-auto bg-slate-950">
            <h2 class="text-2xl font-bold mb-2">Panel Główny - Witaj Szefie!</h2>
            <p class="text-slate-400 mb-6">System zarządzania firmą działa poprawnie w chmurze.</p>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow">
                    <h3 class="text-slate-400 text-sm">Status Wdrożenia</h3>
                    <p class="text-2xl font-bold text-green-400 mt-2">Aktywny (Vercel)</p>
                </div>
                <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow">
                    <h3 class="text-slate-400 text-sm">Wersja PWA</h3>
                    <p class="text-2xl font-bold text-sky-400 mt-2">Gotowa na telefon</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
