<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMG Service - Panel Szefa</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            const [employees, setEmployees] = React.useState([
                { id: 1, name: 'Jan Kowalski', role: 'Murarz / Monter', phone: '123 456 789' }
            ]);
            const [newEmpName, setNewEmpName] = React.useState('');
            const [newEmpRole, setNewEmpRole] = React.useState('');
            const [newEmpPhone, setNewEmpPhone] = React.useState('');

            const [baseRate, setBaseRate] = React.useState(35);
            const [taxMarkup, setTaxMarkup] = React.useState(20);
            const [fixedCosts, setFixedCosts] = React.useState(10);
            const [estimatedCost, setEstimatedCost] = React.useState(1000);
            const [profitMargin, setProfitMargin] = React.useState(30);
            const [vatRate, setVatRate] = React.useState(23);

            const [galleryFolders, setGalleryFolders] = React.useState([
                { id: '1', name: 'Budowa Nowy Sącz', color: 'blue' }
            ]);
            const [newFolderName, setNewFolderName] = React.useState('');
            const [selectedFolder, setSelectedFolder] = React.useState(null);

            const [messages, setMessages] = React.useState([
                { id: 1, sender: 'Szef', text: 'Zbiórka jutro o 7:00.', time: '08:00' }
            ]);
            const [newMessage, setNewMessage] = React.useState('');

            const [pushEnabled, setPushEnabled] = React.useState(true);
            const [pushHour, setPushHour] = React.useState('21:00');

            const totalHourCost = Number(baseRate) * (1 + Number(taxMarkup)/100) + Number(fixedCosts);
            const netClientPrice = Number(estimatedCost) * (1 + Number(profitMargin)/100);
            const netProfit = netClientPrice - Number(estimatedCost);
            const grossClientPrice = netClientPrice * (1 + Number(vatRate)/100);

            return (
                <div className="flex h-screen bg-slate-950 text-slate-100 font-sans overflow-hidden">
                    {/* Menu boczne */}
                    <div className="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col justify-between">
                        <div>
                            <h1 className="text-xl font-bold text-sky-400 mb-6">🛠️ WMG Service</h1>
                            <nav className="space-y-1">
                                <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-2.5 rounded-lg font-medium transition ${activeTab === 'dashboard' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>Panel Główny</button>
                                <button onClick={() => setActiveTab('employees')} className={`w-full text-left px-4 py-2.5 rounded-lg font-medium transition ${activeTab === 'employees' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>Pracownicy</button>
                                <button onClick={() => setActiveTab('estimates')} className={`w-full text-left px-4 py-2.5 rounded-lg font-medium transition ${activeTab === 'estimates' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>Kalkulator i Kosztorysy</button>
                                <button onClick={() => { setActiveTab('gallery'); setSelectedFolder(null); }} className={`w-full text-left px-4 py-2.5 rounded-lg font-medium transition ${activeTab === 'gallery' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>Galeria Zleceń</button>
                                <button onClick={() => setActiveTab('chat')} className={`w-full text-left px-4 py-2.5 rounded-lg font-medium transition ${activeTab === 'chat' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>Komunikator</button>
                                <button onClick={() => setActiveTab('calendar')} className={`w-full text-left px-4 py-2.5 rounded-lg font-medium transition ${activeTab === 'calendar' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>Kalendarz</button>
                                <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-2.5 rounded-lg font-medium transition ${activeTab === 'settings' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>Ustawienia</button>
                            </nav>
                        </div>
                        <div className="text-xs text-slate-500 pt-4 border-t border-slate-800">WMG Service v2.6</div>
                    </div>

                    {/* Główna treść */}
                    <div className="flex-1 p-8 overflow-y-auto bg-slate-950">
                        {activeTab === 'dashboard' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-2">Panel Główny - Witaj Szefie!</h2>
                                <p className="text-slate-400 mb-6">Centrum dowodzenia Twoją firmą.</p>
                                <div className="grid grid-cols-4 gap-4">
                                    <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow">
                                        <h3 className="text-slate-400 text-sm">Pracownicy</h3>
                                        <p className="text-3xl font-bold text-sky-400 mt-2">{employees.length}</p>
                                    </div>
                                    <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow">
                                        <h3 className="text-slate-400 text-sm">Foldery Galerii</h3>
                                        <p className="text-3xl font-bold text-emerald-400 mt-2">{galleryFolders.length}</p>
                                    </div>
                                    <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow">
                                        <h3 className="text-slate-400 text-sm">Status Systemu</h3>
                                        <p className="text-lg font-bold text-green-500 mt-3">Aktywny (Online)</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'employees' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-4">Zarządzanie Pracownikami</h2>
                                <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 mb-6 flex gap-3">
                                    <input type="text" placeholder="Imię i nazwisko" value={newEmpName} onChange={e => setNewEmpName(e.target.value)} className="bg-slate-950 border border-slate-700 p-2.5 rounded-lg text-white text-sm flex-1" />
                                    <input type="text" placeholder="Stanowisko" value={newEmpRole} onChange={e => setNewEmpRole(e.target.value)} className="bg-slate-950 border border-slate-700 p-2.5 rounded-lg text-white text-sm flex-1" />
                                    <input type="text" placeholder="Telefon" value={newEmpPhone} onChange={e => setNewEmpPhone(e.target.value)} className="bg-slate-950 border border-slate-700 p-2.5 rounded-lg text-white text-sm" />
                                    <button onClick={() => { if(newEmpName) { setEmployees([...employees, {id: Date.now(), name: newEmpName, role: newEmpRole, phone: newEmpPhone}]); setNewEmpName(''); setNewEmpRole(''); setNewEmpPhone(''); }}} className="bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 px-5
